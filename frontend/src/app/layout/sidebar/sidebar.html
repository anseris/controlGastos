<nav
  class="app-nav"
  aria-label="Navegación principal"
  (mouseenter)="cancelarCierre()"
  (mouseleave)="programarCierre()"
>
  <p-menubar
    [model]="items"
    styleClass="app-menubar"
    breakpoint="950px"
    [autoHide]="false"
    ariaLabel="Navegación principal"
  >
    <ng-template #start>
      <span class="menu-tag"><i class="pi pi-compass"></i>Menú</span>
    </ng-template>
  </p-menubar>
</nav>
