<header class="topbar">
    <div class="brand-mark"><i class="pi pi-wallet"></i></div>
    <div class="brand-copy">
      <div class="eyebrow">FINANZAS PERSONALES</div>
      <h1>Control de gastos</h1>
      <p>Ingresos, gastos y presupuesto en un solo lugar.</p>
    </div>
    <div class="top-actions">
      <label class="import-button p-button p-component p-button-outlined" for="excelFile"><i class="pi pi-file-import"></i><span>Importar Excel</span></label>
      <input id="excelFile" class="visually-hidden" type="file" accept=".xlsx,.xls,.xlsm">
      <p-button label="Exportar CSV" icon="pi pi-download" severity="secondary" [outlined]="true" ></p-button>
      <p-button label="Nuevo movimiento" icon="pi pi-plus" (onClick)="openNew()"></p-button>

      <div class="user-chip">
        <span class="user-avatar">{{ inicial() }}</span>
        <div class="user-data">
          <strong>{{ usuario()?.nombre }}</strong>
          <small>{{ usuario()?.email }}</small>
        </div>
        <p-button
          icon="pi pi-sign-out"
          severity="secondary"
          [text]="true"
          [rounded]="true"
          ariaLabel="Cerrar sesión"
          title="Cerrar sesión"
          (onClick)="cerrarSesion()"
        ></p-button>
      </div>
    </div>
  </header>
  @if (showModalAddMovement) {
    <app-add-movimiento [showModalAddMovement]="showModalAddMovement"  (modalClosed)="returnCloseModal()"></app-add-movimiento>
  }
