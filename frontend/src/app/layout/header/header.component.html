<header class="topbar">
  <div class="brand-mark"><i class="pi pi-wallet"></i></div>
  <div class="brand-copy">
    <div class="eyebrow">FINANZAS PERSONALES</div>
    <h1>Control de gastos</h1>
    <p>Ingresos, gastos y presupuesto en un solo lugar.</p>
  </div>
  <div class="top-actions">
    <div class="balance-chip" aria-live="polite">
      <span class="balance-icon"><i class="pi pi-wallet" aria-hidden="true"></i></span>
      <span class="balance-data">
        <small>Balance total acumulado</small>
        <strong [class.negative]="balanceHistorico() < 0">
          {{ balanceHistorico() | currency: 'EUR' }}
        </strong>
      </span>
    </div>
    <div class="user-chip">
      <span class="user-avatar">{{ inicial() }}</span>
      <div class="user-data">
        <strong>{{ usuario()?.nombre }}</strong>
        <small>{{ usuario()?.email }}</small>
      </div>
      <p-button
        icon="pi pi-sign-out"
        severity="secondary"
        [text]="true"
        [rounded]="true"
        ariaLabel="Cerrar sesión"
        title="Cerrar sesión"
        (onClick)="cerrarSesion()"
      ></p-button>
    </div>
  </div>
</header>
